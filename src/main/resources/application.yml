spring:
  application:
    name: enotes-api-service

  profiles:
    active: dev
---
#Dev config
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://localhost:3307/enotes_dev
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ro

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
          max-file-size: 50MB
          max-request-size: 10MB

  mail:
    host: smtp.gmail.com
    username: vtn12032004@gmail.com
    port: 587
    password: rpzlwrlgycrzwoyl
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

file:
  upload:
    path: notes/

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
    path: /enotes-doc
  api-docs:
    path: /enotes-api-doc

email:
